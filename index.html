<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gridiron GM</title>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-x" data-action="closeModal">×</button><div id="modal-body"></div></div></div>
  <div id="toast"></div>
  <div id="busy"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="errbar" class="hidden"></div>
  <!-- every load pulls fresh code (no stale cached scripts after an update) -->
  <script>
    (function () {
      var v = Date.now();
      document.write('<link rel="stylesheet" href="css/style.css?v=' + v + '">');
      ['js/util.js', 'js/data.js', 'js/attributes.js', 'js/derived.js', 'js/players.js', 'js/coaches.js', 'js/perception.js', 'js/contracts.js', 'js/depthchart.js', 'js/engine/depth.js', 'js/engine/calls.js', 'js/engine/trench.js', 'js/engine/plays.js', 'js/engine/metrics.js', 'js/engine/penalties.js', 'js/engine/game.js', 'js/league.js', 'js/offseason.js', 'js/trade.js', 'js/scouting.js', 'js/ui.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
    })();
  </script>
</body>
</html>
