<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121a2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gridiron GM">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Gridiron GM</title>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-x" data-action="closeModalAll">×</button><div id="modal-body"></div></div></div>
  <div id="toast"></div>
  <div id="busy"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="errbar" class="hidden"></div>
  <script>
    // offline: keep the last copy that loaded (only when served over http; a local file needs none of this)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  </script>
  <!-- every load pulls fresh code (no stale cached scripts after an update) -->
  <script>
    (function () {
      var v = Date.now();
      document.write('<link rel="stylesheet" href="css/style.css?v=' + v + '">');
      ['js/util.js', 'js/data.js', 'js/attributes.js', 'js/derived.js', 'js/players.js', 'js/coaches.js', 'js/perception.js', 'js/scouttext.js', 'js/contracts.js', 'js/depthchart.js', 'js/develop.js', 'js/engine/depth.js', 'js/engine/calls.js', 'js/engine/trench.js', 'js/engine/plays.js', 'js/engine/metrics.js', 'js/engine/game.js', 'js/league.js', 'js/offseason.js', 'js/preseason.js', 'js/camp.js', 'js/trade.js', 'js/ui.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
    })();
  </script>
</body>
</html>
